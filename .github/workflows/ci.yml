name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the eval harness (spends Anthropic tokens)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Secrets scan
        run: uv run detect-secrets scan --baseline .secrets.baseline

  evals:
    name: eval harness (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    needs: checks
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_SQL_CAPABILITY_TOKEN: ci-eval-token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Seed + index
        run: |
          uv run python -m durable_agent.seed --out data/lakehouse
          uv run python -m durable_agent.retrieval.index --governance governance --out data/index
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Run evals
        run: uv run python -m evals.runner --concurrency 4
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
