name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the eval harness (spends Anthropic tokens)"
        type: boolean
        default: false
      run_quickstart_full:
        description: "Quickstart smoke also runs make ask + make demo-crash (~7 cents)"
        type: boolean
        default: false
      capture_screenshots:
        description: "Run make screenshots and upload the PNGs (~6 cents)"
        type: boolean
        default: false

# Least privilege for the automatic GITHUB_TOKEN: nothing here writes to the repo.
permissions:
  contents: read

# Pushes supersede older pushes on the same branch; manual eval dispatches never cancel (or get
# cancelled by) a push run, so the commit's CI status always reflects the code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: lint · typecheck · test · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Pyright (same checks as VS Code Pylance)
        run: uv run pyright

      - name: Tests
        run: uv run pytest

      - name: Secrets scan
        run: make secrets-scan

  # GitHub renders Mermaid in the browser and shows only "Unable to render rich display" when a
  # diagram fails to parse, so render every diagram here and fail the PR instead.
  docs:
    name: docs · mermaid diagrams render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: |
          uv sync --all-groups
          uv run playwright install --with-deps chromium
      - name: make docs-check
        run: make docs-check

  # Runs the README Quickstart literally on a clean runner with fresh Docker volumes: seed, index,
  # make up, make mcp, make worker, and checks the worker is polling Temporal. Zero tokens unless
  # dispatched manually with run_quickstart_full, which adds make ask and make demo-crash.
  quickstart:
    name: README quickstart smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: make install
        run: make install

      - name: make quickstart-smoke
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_quickstart_full) }}
        run: make quickstart-smoke

      - name: make quickstart-smoke FULL=1 (manual only; spends tokens)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_quickstart_full }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make quickstart-smoke FULL=1

  # Manual only: regenerates docs/DEMO.md's Temporal UI screenshots on a clean runner, proving
  # `make screenshots` still works end to end; the PNGs are an artifact to review and commit.
  screenshots:
    name: Temporal UI screenshots (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.capture_screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_SQL_CAPABILITY_TOKEN: ci-screenshots-token   # ephemeral local MCP server; not a secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: |
          uv sync --all-groups
          uv run playwright install --with-deps chromium
      - name: Seed + index
        run: make seed index
      - name: make screenshots
        run: make screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: temporal-ui-screenshots
          path: |
            docs/demo/temporal-*.png
            data/screenshots/

  # Manual only: the secret is never available to pull_request runs. The Temporal dev server is
  # downloaded by the SDK itself (pinned, checksummed) rather than via a curl | sh install.
  evals:
    name: eval harness (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_SQL_CAPABILITY_TOKEN: ci-eval-token   # ephemeral in-process MCP server; not a secret
      LLM_CACHE: "false"                        # cold run: real cost and real behaviour
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Seed + index
        run: |
          uv run python -m durable_agent.seed --out data/lakehouse
          uv run python -m durable_agent.retrieval --governance governance --out data/index
      - name: Run evals
        run: uv run python -m evals.runner --concurrency 4 --min-execution 0.9
      - uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
