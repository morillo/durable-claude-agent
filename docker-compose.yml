# Local infrastructure: Temporal dev server + Arize Phoenix (OTLP trace collector and UI).
#
#   make up      -> docker compose up -d --wait (fails if Temporal never becomes healthy)
#   make down    -> docker compose down
#
# `make temporal` (brew-installed CLI) is the alternative for Temporal; do not run both, they
# share port 7233. Phoenix is only available through compose.
services:
  # The Temporal image runs as uid 1000, but a new named volume is owned by root, so SQLite
  # cannot create /data/temporal.db. This one-shot step hands /data to uid 1000 first.
  temporal-init:
    image: temporalio/temporal:latest
    user: "0"
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes:
      - temporal-data:/data

  temporal:
    image: temporalio/temporal:latest
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-ip=0.0.0.0
      - --db-filename=/data/temporal.db
      - --search-attribute=AnalystStage=Keyword
      - --search-attribute=AnalystRisk=Keyword
      - --search-attribute=AnalystRequester=Keyword
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Web UI
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI + OTLP/HTTP receiver (/v1/traces)
      - "4317:4317"   # OTLP/gRPC receiver
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  temporal-data:
  phoenix-data:
